<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Lab-M4.3: схема розташування цехів</title>
<desc id="d">Схема постачальної станції Lab-M4.3: від шахти через розподільчий цех, склад і чисті цехи до відправлення.</desc>
<style>
.paper{fill:#efe6d0}
.frame{fill:none;stroke:#3a342b;stroke-width:3}
